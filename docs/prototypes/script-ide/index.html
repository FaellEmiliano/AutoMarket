<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoMarket — protótipo da IDE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Protótipo descartável: três direções da IDE, alternadas por ?variant=a|b|c. -->
  <main id="app"></main>
  <nav class="prototype-switcher" aria-label="Alternar proposta">
    <button id="previousVariant" aria-label="Proposta anterior">←</button>
    <div><small>PROTÓTIPO</small><strong id="variantLabel"></strong></div>
    <button id="nextVariant" aria-label="Próxima proposta">→</button>
  </nav>
  <script src="app.js"></script>
</body>
</html>
